# Fluent Bit Configuration - Advanced (MOV.AI Structured Parsing)
# Full-featured mode: service routing + structured parsers + Lua post-processing
#
# Processing Pipeline:
#   1. Service routing: separate backend/spawner/orchestrator/ros1-workspace/ros2-workspace from generic services
#   2. Lua post-processing: ANSI stripping + tag extraction
#   3. Structured parsers: MOV.AI callback_logs + python_structured formats
#   4. Generic fallback: app_logs + docker for other services
#
# Feature flags (controlled via environment variables):
#   ENABLE_COMPRESSION: snappy or off (default: snappy)
#   ENABLE_STORAGE_METRICS: on or off (default: off)
#   ENABLE_HTTP_METRICS: true or false (default: false)
#   ENABLE_LOKI_OUTPUT: true or false (default: true) - skips Loki outputs/filters when no Loki server is deployed
#   ENABLE_MIMIR_OUTPUT: true or false (default: true) - skips the telemetry Mimir/OTLP output when no Mimir server is deployed

env:
  # cannot be overridden by ENV vars if defined here
  # LOG_LEVEL: info
  # LOKI_HOST: loki
  # LOKI_PORT: 3100
  # DEVICE_NAME: default-device
  # APP_NAME: default-app
  FLUSH_INTERVAL: 5
service:
  flush: ${FLUSH_INTERVAL}
  daemon: off
  log_level: ${LOG_LEVEL}
  scheduler.base: 3
  scheduler.cap: 30
  http_server: ${ENABLE_HTTP_METRICS}
  http_listen: 0.0.0.0
  http_port: 2020
  parsers_file: /fluent-bit/etc/parsers.conf
  storage.path: /var/log/flb-storage/
  storage.sync: normal
  storage.checksum: off
  storage.max_chunks_up: 128
  storage.backlog.mem_limit: ${FLUENT_BIT_BACKLOG_MEM_LIMIT}
  storage.total_limit_size: ${FLUENT_BIT_LOKI_TOTAL_LIMIT_SIZE}
  storage.metrics: ${ENABLE_STORAGE_METRICS}

# Forward Input - Receives logs from other Fluent Bit instances or applications
pipeline:
  inputs:
    # Logs input - accepts logs via TCP socket
    - name: forward
      listen: 0.0.0.0
      port: 24224
      buffer_chunk_size: 1M
      buffer_max_size: ${FLUENT_BIT_BUFFER_MAX_SIZE}
      storage.type: filesystem # Use filesystem storage for reliability

    # Metrics input - accepts metrics via TCP socket
    - name: forward
      listen: 0.0.0.0
      port: 24225
      tag: metrics.*
      buffer_chunk_size: 1M
      buffer_max_size: 6M
      storage.type: filesystem # Use filesystem storage for reliability

    #__SECURITY_INPUTS__

    #__TELEMETRY_INPUTS__

  filters:
    # Fallback no-op (never matches any real tag): keeps this section non-empty when all optional filters below are disabled.
    - name: modify
      match: __disabled__
      copy: dummy dummy

    #__CORE_LOKI_FILTERS__

    #__SECURITY_FILTERS__

    #__TELEMETRY_FILTERS__

    #__TELEMETRY_FILTERS_MIMIR__

  outputs:
    # Fallback no-op (never matches any real tag): keeps this section non-empty when all optional outputs below are disabled.
    - name: null
      match: __disabled__

    #__CORE_LOKI_OUTPUTS__

    #__SECURITY_OUTPUTS__

    #__TELEMETRY_OUTPUTS_LOKI__

    #__TELEMETRY_OUTPUTS_MIMIR__
